name: Render all templates

on:
  workflow_call:
    inputs:
      # Workflow settings
      runs-on:
        description: "The runner to use for the workflow"
        required: false
        type: string
        default: "ubuntu-latest"
      toolkit-cli:
        description: |
          The command to run the challenge toolkit CLI.
          Defaults to `challenge-toolkit` if not provided.
        required: false
        type: string
        default: "challenge-toolkit"
      toolkit-install-package:
        description: |
          Challenge toolkit installation package name.
          Must be a package available that can be installed with uv.
          Is combined with the toolkit-version input to determine the exact version to install.

          Defaults to the official `challenge-toolkit` - https://github.com/ctfpilot/challenge-toolkit
        required: false
        default: "challenge-toolkit"
        type: string
      toolkit-version:
        description: |
          The version of the CTF Pilot's Challenge Toolkit to use.
          Must be a version available that can be installed with uv.
          Current version is 2.0.0.

          If set, the toolkit install package is installed with the specified version using `uv tool install <package>==<version>`. 
          If the version is an empty string, the toolkit install package is installed without a version constraint, allowing to use git-based installations or other versioning methods.
        required: false
        type: string
        default: "2.0.0"
      fetch-submodules:
        description: "Whether to fetch git submodules"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  render_templates:
    name: Render all templates
    runs-on: ${{ inputs.runs-on || 'ubuntu-latest' }}
    steps:
      - name: Clone repository
        uses: actions/checkout@v7.0.1

      - name: Ensure submodules are fetched
        if: ${{ inputs.fetch-submodules == true }}
        run: git submodule update --init --recursive

      # Install python and dependencies
      - name: Install python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.x"
      - name: Install uv
        uses: astral-sh/setup-uv@803947b9bd8e9f986429fa0c5a41c367cd732b41 # v7
        with:
          enable-cache: true
      - name: Install python dependencies
        run: uv tool install "$INPUT_TOOLKIT_INSTALL_PACKAGE$INPUT_TOOLKIT_VERSION"
        env:
          INPUT_TOOLKIT_VERSION: ${{ inputs.toolkit-version != '' && format('=={0}', inputs.toolkit-version) || '' }}
          INPUT_TOOLKIT_INSTALL_PACKAGE: ${{ inputs.toolkit-install-package }}

      # Generate templates
      - name: Generate list of challenges
        id: challenges
        run: |
          if [ -d "challenges" ] && [ "$(ls -A challenges)" ]; then
            categories=$(echo $(ls challenges) | tr ' ' ',')
          else
            echo "Warning: 'challenges' directory does not exist or is empty."
            echo "::notice title=No challenges found::The 'challenges' directory is missing or empty. No challenges to process."
            exit 0
          fi

          full_challenges=""
          for category in $(echo "$categories" | tr ',' ' '); do
            category_path="challenges/$category"
            if [ ! -d "$category_path" ] || [ -z "$(ls -A "$category_path")" ]; then
              echo "Warning: Category directory '$category_path' does not exist or is empty."
              echo "::notice title=No challenges found in category '$category'::The category directory '$category_path' is missing or empty. No challenges to process in this category."
              continue
            fi

            for challenge in $(ls "$category_path"); do
              full_challenges="$full_challenges,$category/$challenge"
            done
          done

          if [ -n "$full_challenges" ]; then
            full_challenges=$(echo "$full_challenges" | cut -c 2-)
          else
            echo "No challenges found in any category, exiting."
            echo "::notice title=No challenges found::No challenges found in any category."
            exit 0
          fi

          for challenge in $(echo "$full_challenges" | tr ',' ' '); do
            "$INPUT_TOOLKIT" template clean "$challenge"
            "$INPUT_TOOLKIT" template k8s "$challenge"
            "$INPUT_TOOLKIT" template configmap "$challenge"
            "$INPUT_TOOLKIT" template handout "$challenge"
          done
        env:
          INPUT_TOOLKIT: ${{ inputs.toolkit-cli || 'challenge-toolkit' }}

      - name: Configure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add and commit changes
        run: |
          git add challenges/**
          git diff --cached --quiet || git commit -m "CI: Update challenges [skip ci]"

      - name: Push changes
        run: |
          set -euo pipefail
          BRANCH="$REF_NAME"

          # Try a few times to avoid race conditions when multiple runs push concurrently.
          tries=10
          attempt=1
          while [ $attempt -le $tries ]; do
            echo "Attempt $attempt: fetch+rebase"
            git fetch origin "$BRANCH"
            git pull --rebase --no-edit origin "$BRANCH"

            echo "Attempt $attempt: push"
            if git push origin "$BRANCH"; then
              echo "Push succeeded on attempt $attempt"
              break
            fi

            echo "Push failed on attempt $attempt, retrying after backoff"
            sleep $((attempt * 2))
            attempt=$((attempt + 1))
          done

          if [ $attempt -gt $tries ]; then
            echo "Failed to push after $tries attempts"
            exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
